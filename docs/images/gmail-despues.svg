<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Gmail organizado por temas y candidatos de limpieza, simulación</title><desc id="desc">Ejemplo ficticio tras nombrar y aprobar grupos temáticos. Cada grupo tiene subcarpeta de candidatos a borrar. Los correos no se borran ni archivan.</desc><rect width="1200" height="790" rx="20" fill="#f6f8fc"/><g font-family="Arial,sans-serif" fill="#202124"><text x="28" y="42" font-size="25" font-weight="bold">Gmail · Propuesta organizada por contenido</text><rect x="820" y="15" width="350" height="38" rx="19" fill="#ffedc2"/><text x="840" y="40" font-size="15" font-weight="bold">SIMULACIÓN · DATOS FICTICIOS</text><rect x="310" y="76" width="860" height="48" rx="24" fill="#e9eef6"/><text x="335" y="106" font-size="17" fill="#5f6368">Buscar en el correo</text><rect x="15" y="82" width="205" height="50" rx="16" fill="#c2e7ff"/><text x="45" y="114" font-size="18">Redactar</text><rect x="10" y="150" width="277" height="38" rx="19" fill="#d3e3fd"/><text x="28" y="175" font-size="16" font-weight="bold">Recibidos · mismos mensajes</text><text x="28" y="220" font-size="15" font-weight="bold" fill="#202124">Organizador / Temas</text><text x="40" y="255" font-size="15" font-weight="normal" fill="#202124">Viajes / Inspiración</text><text x="58" y="285" font-size="15" font-weight="normal" fill="#895900">Candidatos a borrar</text><text x="40" y="325" font-size="15" font-weight="normal" fill="#202124">Ocio / Senderismo</text><text x="58" y="355" font-size="15" font-weight="normal" fill="#895900">Candidatos a borrar</text><text x="40" y="395" font-size="15" font-weight="normal" fill="#202124">Cuentas / Notificaciones</text><text x="58" y="425" font-size="15" font-weight="normal" fill="#895900">Candidatos a borrar</text><text x="28" y="475" font-size="15" font-weight="bold" fill="#202124">Organizador / Entidades</text><text x="40" y="508" font-size="15" font-weight="normal" fill="#202124">proveedor.example</text><text x="28" y="550" font-size="15" font-weight="bold" fill="#202124">Revisión necesaria</text><rect x="310" y="145" width="860" height="410" rx="16" fill="white"/><text x="334" y="180" font-size="19" font-weight="bold">Principal · Etiquetas aprobadas</text><path d="M310 202H1170" stroke="#e1e5eb"/><text x="330" y="225" font-size="15">□ ☆ Boletín Ejemplo · Ideas para viajar · Travel tips</text><text x="1080" y="225" font-size="13">12/01/24</text><text x="365" y="249" font-size="14" fill="#1967d2">Viajes / Inspiración · Candidatos a borrar</text><path d="M310 268H1170" stroke="#e1e5eb"/><text x="330" y="291" font-size="15">□ ☆ Hotel Ejemplo · Hotel invoice / Factura de hotel</text><text x="1080" y="291" font-size="13">01/10/26</text><text x="365" y="315" font-size="14" fill="#1967d2">Protegido: propuesta local, sin cambio remoto</text><path d="M310 334H1170" stroke="#e1e5eb"/><text x="330" y="357" font-size="15">□ ☆ Equipo Ejemplo · Mountain hiking · Ruta de montaña</text><text x="1080" y="357" font-size="13">20/10/26</text><text x="365" y="381" font-size="14" fill="#1967d2">Ocio / Senderismo</text><path d="M310 400H1170" stroke="#e1e5eb"/><text x="330" y="423" font-size="15">□ ☆ Avisos Ejemplo · Resumen automático antiguo</text><text x="1080" y="423" font-size="13">03/06/24</text><text x="365" y="447" font-size="14" fill="#1967d2">Cuentas / Notificaciones · Candidatos a borrar</text><path d="M310 466H1170" stroke="#e1e5eb"/><text x="330" y="489" font-size="15">□ ☆ Ana Ejemplo · Mensaje sin contexto suficiente</text><text x="1080" y="489" font-size="13">21/10/26</text><text x="365" y="513" font-size="14" fill="#1967d2">Revisión necesaria</text><rect x="28" y="593" width="1140" height="76" rx="14" fill="#e2f3e7"/><text x="46" y="621" font-size="18" font-weight="bold">Inglés y español comparten temas. Cada grupo ofrece limpieza revisable.</text><text x="46" y="649" font-size="16">0 borrados · 0 archivados · Los candidatos requieren una decisión humana.</text><text x="28" y="708" font-size="15" fill="#5f6368">Nombres ilustrativos tras revisión o renombrado opcional con IA. No son una promesa de resultado.</text><text x="28" y="736" font-size="15" fill="#5f6368">El motor propone nombres por términos; no todos los grupos ni mensajes se clasifican correctamente sin validación.</text><text x="28" y="764" font-size="15" fill="#5f6368">Los protegidos conservan resultado local y se omiten al aplicar etiquetas. No hay datos reales en esta imagen.</text></g></svg>