[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-organizer-local"
version = "0.2.0"
description = "Base local para descubrir y validar una taxonomía personal del histórico de correo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2", "keyring>=25,<26"]
semantic = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3", "scipy>=1.13,<2"]
neural = ["sentence-transformers>=3,<6", "transformers>=4.41,<5", "torch>=2.6,<3"]

[project.scripts]
email-organizer = "email_organizer.cli:main"

[tool.setuptools.packages.find]
include = ["email_organizer*"]
