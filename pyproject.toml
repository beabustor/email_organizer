[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-organizer-local"
version = "0.1.0"
description = "Organizador local de correo con propuestas revisables"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2", "keyring>=25,<26"]

[project.scripts]
email-organizer = "email_organizer.cli:main"

[tool.setuptools.packages.find]
include = ["email_organizer*"]
