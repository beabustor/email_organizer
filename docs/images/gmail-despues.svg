<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
 <title id="title">Después: Gmail con etiquetas aprobadas, simulación</title>
 <desc id="desc">Los mismos mensajes siguen en Recibidos. Newsletters y notificaciones aprobadas tienen etiquetas; los candidatos antiguos también llevan Revisar para borrar. La factura protegida permanece sin cambios. Ningún mensaje ha sido eliminado.</desc>
 <rect width="1100" height="720" rx="20" fill="#f6f8fc"/>
 <g font-family="Arial,sans-serif" fill="#202124">
  <text x="30" y="44" font-size="25" font-weight="bold">Gmail · Después de aprobar y etiquetar</text>
  <rect x="740" y="18" width="330" height="36" rx="18" fill="#ffedc2"/>
  <text x="760" y="42" font-size="15" font-weight="bold">SIMULACIÓN · DATOS FICTICIOS</text>
  <rect x="280" y="76" width="790" height="48" rx="24" fill="#e9eef6"/>
  <text x="305" y="106" font-size="17" fill="#5f6368">Buscar en el correo</text>
  <rect x="18" y="84" width="193" height="50" rx="16" fill="#c2e7ff"/><text x="48" y="115" font-size="18">Redactar</text>
  <rect x="10" y="153" width="250" height="38" rx="19" fill="#d3e3fd"/>
  <text x="28" y="178" font-size="16" font-weight="bold">Recibidos</text><text x="195" y="178" font-size="15">28.450</text>
  <text x="28" y="218" font-size="16">Destacados</text><text x="28" y="258" font-size="16">Enviados</text>
  <text x="28" y="316" font-size="16" font-weight="bold">Organizador</text>
  <text x="38" y="351" font-size="15">Newsletters</text><text x="38" y="385" font-size="15">Notificaciones</text><text x="38" y="419" font-size="15">Correo masivo</text><text x="38" y="453" font-size="15">Otros</text>
  <rect x="24" y="470" width="237" height="39" rx="12" fill="#fff0cf"/><text x="38" y="495" font-size="15" font-weight="bold">Revisar para borrar</text>
  <rect x="280" y="145" width="790" height="400" rx="16" fill="white"/>
  <text x="304" y="180" font-size="19" font-weight="bold">Principal</text><text x="940" y="180" font-size="14">1–6 de 28.450</text>
  <path d="M280 200H1070 M280 253H1070 M280 306H1070 M280 359H1070 M280 412H1070 M280 465H1070" stroke="#e1e5eb"/>
  <g font-size="14">
   <text x="298" y="224">□ ☆ Boletín Ejemplo · Novedades de la semana</text><text x="320" y="244" fill="#895900">Newsletters · Revisar para borrar</text><text x="975" y="231">12/01/24</text>
   <text x="298" y="277">□ ☆ Notificaciones · Resumen de actividad</text><text x="320" y="297" fill="#895900">Notificaciones · Revisar para borrar</text><text x="975" y="284">03/06/24</text>
   <text x="298" y="330">□ ★ Proveedor Ejemplo · Factura de septiembre</text><text x="320" y="350" fill="#1a7340">Protegido: sin cambios</text><text x="975" y="337">01/10/26</text>
   <text x="298" y="383">□ ☆ Ana Ejemplo · ¿Quedamos el sábado?</text><text x="320" y="403" fill="#1967d2">Otros</text><text x="975" y="390">20/10/26</text>
   <text x="298" y="436">□ ☆ Club Ejemplo · Ofertas de temporada</text><text x="320" y="456" fill="#895900">Correo masivo · Revisar para borrar</text><text x="975" y="443">05/02/24</text>
   <text x="298" y="489">□ ☆ Boletín Ejemplo · Novedades de este mes</text><text x="320" y="509" fill="#1967d2">Newsletters</text><text x="975" y="496">21/10/26</text>
  </g>
  <rect x="30" y="568" width="1040" height="66" rx="14" fill="#e2f3e7"/>
  <text x="48" y="595" font-size="18" font-weight="bold">Mismos correos; ahora puedes filtrarlos por etiqueta.</text>
  <text x="48" y="619" font-size="16">0 borrados · 0 archivados · Solo se aplican las propuestas que apruebes.</text>
  <text x="30" y="671" font-size="16" fill="#5f6368">«Protegido: sin cambios» es una explicación de esta ilustración, no una etiqueta creada en Gmail.</text>
  <text x="30" y="696" font-size="16" fill="#5f6368">Simulación visual; fechas y cantidades ficticias. La apariencia real de Gmail puede variar.</text>
 </g>
